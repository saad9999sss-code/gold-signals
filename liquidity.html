<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤشر السيولة | Liquidity Hunter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e14;color:#e6e6e6;font-family:-apple-system,Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
h1{font-size:18px;color:#d4af37;margin:10px 0 6px;text-align:center}
.row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
select,input{background:#161b26;color:#fff;border:1px solid #2a3142;border-radius:8px;padding:8px;font-size:14px;flex:1;min-width:0}
label{font-size:12px;color:#9aa4b5;display:flex;flex-direction:column;gap:3px;flex:1}
.chk{flex-direction:row;align-items:center;gap:6px}
.chk input{flex:0}
#price{font-size:26px;font-weight:700;text-align:center;direction:ltr}
#chg{text-align:center;font-size:13px;direction:ltr;margin-bottom:4px}
.up{color:#26a69a}.dn{color:#ef5350}
canvas{width:100%;height:56vh;background:#0f131c;border-radius:10px;display:block;touch-action:pan-y}
#banner{display:none;margin:8px 0;padding:10px;border-radius:8px;font-weight:700;text-align:center}
#log{margin-top:8px;font-size:13px}
#log div{padding:7px 8px;border-bottom:1px solid #1d2433;display:flex;justify-content:space-between}
#status{font-size:11px;color:#6b7686;text-align:center;margin:6px 0}
.legend{font-size:11px;color:#9aa4b5;text-align:center;margin-top:6px;line-height:1.8}
</style>
</head>
<body>
<h1>مؤشر السيولة — Liquidity Hunter</h1>
<div class="row">
  <label>السوق
    <select id="sym">
      <option value="PAXGUSDT">الذهب (PAXG)</option>
      <option value="BTCUSDT">بيتكوين BTC</option>
      <option value="ETHUSDT">إيثريوم ETH</option>
      <option value="EURUSDT">يورو EUR/USDT</option>
      <option value="GBPUSDT">جنيه GBP/USDT</option>
      <option value="SOLUSDT">سولانا SOL</option>
    </select>
  </label>
  <label>الفريم
    <select id="tf">
      <option value="1m">1 دقيقة</option>
      <option value="5m" selected>5 دقايق</option>
      <option value="15m">15 دقيقة</option>
      <option value="1h">ساعة</option>
      <option value="4h">4 ساعات</option>
    </select>
  </label>
</div>
<div class="row">
  <label>قوة القمة/القاع <input id="len" type="number" value="8" min="2" max="30"></label>
  <label>تسامح التساوي % <input id="tol" type="number" value="0.05" step="0.01" min="0"></label>
  <label class="chk"><input id="onlyEq" type="checkbox"> المتساوية فقط</label>
</div>
<div id="price">--</div>
<div id="chg">--</div>
<div id="banner"></div>
<canvas id="cv"></canvas>
<div class="legend">
  <span style="color:#ef5350">━ EQH قمم متساوية</span> &nbsp;
  <span style="color:#26a69a">━ EQL قيعان متساوية</span> &nbsp;
  <span>┄ مستوى عادي</span><br>
  ▼ سحب قمم (احتمال هبوط) &nbsp; ▲ سحب قيعان (احتمال صعود)
</div>
<div id="log"></div>
<div id="status">جاري التحميل...</div>

<script>
const BASES=["https://data-api.binance.vision","https://api.binance.com"];
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
let candles=[],res={levels:[],sweeps:[]},viewN=110,offset=0,lastAlertKey="";

async function fetchKlines(){
  const sym=$("sym").value,tf=$("tf").value;
  let err;
  for(const b of BASES){
    try{
      const r=await fetch(`${b}/api/v3/klines?symbol=${sym}&interval=${tf}&limit=500`);
      if(!r.ok) throw new Error(r.status);
      const a=await r.json();
      return a.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4]}));
    }catch(e){err=e}
  }
  throw err;
}

function analyze(){
  const len=+$("len").value||8,tol=+$("tol").value,onlyEq=$("onlyEq").checked;
  const n=candles.length;
  const levels=[],sweeps=[];
  let actH=[],actL=[];
  for(let j=0;j<n;j++){
    const i=j-len;
    if(i>=len){
      let isH=true,isL=true;
      for(let k=i-len;k<=i+len;k++){
        if(k===i)continue;
        if(candles[k].h>=candles[i].h)isH=false;
        if(candles[k].l<=candles[i].l)isL=false;
      }
      if(isH){
        const p=candles[i].h;
        const eq=actH.some(x=>Math.abs(x.p-p)/p*100<=tol);
        if(eq||!onlyEq){const L={type:"H",p,i,eq,end:null,result:null};levels.push(L);actH.push(L);}
      }
      if(isL){
        const p=candles[i].l;
        const eq=actL.some(x=>Math.abs(x.p-p)/p*100<=tol);
        if(eq||!onlyEq){const L={type:"L",p,i,eq,end:null,result:null};levels.push(L);actL.push(L);}
      }
    }
    const c=candles[j];
    actH=actH.filter(L=>{
      if(c.h>L.p){
        L.end=j;
        if(c.c<L.p){L.result="sweep";sweeps.push({j,type:"H",p:L.p,eq:L.eq,t:c.t});}
        else L.result="break";
        return false;
      }return true;
    });
    actL=actL.filter(L=>{
      if(c.l<L.p){
        L.end=j;
        if(c.c>L.p){L.result="sweep";sweeps.push({j,type:"L",p:L.p,eq:L.eq,t:c.t});}
        else L.result="break";
        return false;
      }return true;
    });
  }
  res={levels,sweeps};
}

function fmt(p){return p>=1000?p.toFixed(2):p>=10?p.toFixed(3):p.toFixed(5)}

function draw(){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const n=candles.length;if(!n)return;
  const end=n-offset,start=Math.max(0,end-viewN);
  const vis=candles.slice(start,end);
  let hi=-Infinity,lo=Infinity;
  vis.forEach(c=>{hi=Math.max(hi,c.h);lo=Math.min(lo,c.l)});
  const pad=(hi-lo)*0.06||1;hi+=pad;lo-=pad;
  const axisW=62,cw=(W-axisW)/vis.length;
  const X=i=>(i-start+0.5)*cw;
  const Y=p=>H-((p-lo)/(hi-lo))*H;
  // grid + axis
  ctx.font="10px sans-serif";ctx.textAlign="left";ctx.fillStyle="#6b7686";ctx.strokeStyle="#1b2230";ctx.lineWidth=1;
  for(let g=0;g<=6;g++){
    const p=lo+(hi-lo)*g/6,y=Y(p);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-axisW,y);ctx.stroke();
    ctx.fillText(fmt(p),W-axisW+4,y+3);
  }
  // levels
  res.levels.forEach(L=>{
    const e=L.end===null?n-1:L.end;
    if(e<start||L.i>=end)return;
    const x1=X(Math.max(L.i,start)),x2=X(Math.min(e,end-1));
    const y=Y(L.p);if(y<0||y>H)return;
    const active=L.end===null;
    const col=L.result?"#667085":(L.type==="H"?"#ef5350":"#26a69a");
    ctx.strokeStyle=col;ctx.lineWidth=L.eq?2:1;
    ctx.setLineDash(L.eq&&active?[]:[4,4]);
    ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(active?W-axisW:x2,y);ctx.stroke();
    ctx.setLineDash([]);
    if(L.eq&&active){ctx.fillStyle=col;ctx.font="bold 10px sans-serif";ctx.fillText(L.type==="H"?"EQH":"EQL",Math.max(x1,2),y+(L.type==="H"?-3:11));}
  });
  // candles
  vis.forEach((c,k)=>{
    const x=(k+0.5)*cw,up=c.c>=c.o,col=up?"#26a69a":"#ef5350";
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,Y(c.h));ctx.lineTo(x,Y(c.l));ctx.stroke();
    const bt=Y(Math.max(c.o,c.c)),bh=Math.max(1,Math.abs(Y(c.o)-Y(c.c)));
    ctx.fillRect(x-cw*0.35,bt,cw*0.7,bh);
  });
  // sweeps
  res.sweeps.forEach(s=>{
    if(s.j<start||s.j>=end)return;
    const x=X(s.j),c=candles[s.j];
    ctx.font="bold 11px sans-serif";ctx.textAlign="center";
    if(s.type==="H"){ctx.fillStyle="#ef5350";ctx.fillText("▼ Sweep",x,Y(c.h)-6);}
    else{ctx.fillStyle="#26a69a";ctx.fillText("▲ Sweep",x,Y(c.l)+14);}
  });
  ctx.textAlign="left";
  // last price line
  const lp=candles[n-1].c,ly=Y(lp);
  ctx.strokeStyle="#d4af37";ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W-axisW,ly);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#d4af37";ctx.fillRect(W-axisW,ly-8,axisW,16);ctx.fillStyle="#000";ctx.font="bold 10px sans-serif";ctx.fillText(fmt(lp),W-axisW+3,ly+3);
}

function render(){
  const n=candles.length;if(!n)return;
  const last=candles[n-1],prev=candles[Math.max(0,n-2)];
  $("price").textContent=fmt(last.c);
  const d=last.c-candles[0].o,pc=d/candles[0].o*100;
  $("chg").textContent=(d>=0?"+":"")+fmt(d)+"  ("+(d>=0?"+":"")+pc.toFixed(2)+"%)";
  $("chg").className=d>=0?"up":"dn";
  // banner for sweep in last 3 candles
  const rec=res.sweeps.filter(s=>s.j>=n-3).pop();
  const b=$("banner");
  if(rec){
    b.style.display="block";
    b.style.background=rec.type==="H"?"#3a1618":"#10302c";
    b.style.color=rec.type==="H"?"#ef5350":"#26a69a";
    b.textContent=(rec.type==="H"?"▼ سحب سيولة فوق القمة ":"▲ سحب سيولة تحت القاع ")+fmt(rec.p)+(rec.eq?" (متساوية)":"");
    const key=rec.j+rec.type+rec.p;
    if(key!==lastAlertKey){lastAlertKey=key;if(navigator.vibrate)navigator.vibrate([200,100,200]);}
  }else b.style.display="none";
  // log
  const items=res.sweeps.slice(-8).reverse();
  $("log").innerHTML=items.length?items.map(s=>{
    const tm=new Date(s.t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    return `<div><span class="${s.type==="H"?"dn":"up"}">${s.type==="H"?"▼ سحب قمم":"▲ سحب قيعان"}${s.eq?" • متساوية":""}</span><span dir="ltr">${fmt(s.p)} &nbsp; ${tm}</span></div>`;
  }).join(""):"<div><span>ما فيه سحب سيولة بالفترة الحالية</span></div>";
  draw();
}

async function load(){
  try{
    candles=await fetchKlines();
    analyze();render();
    $("status").textContent="بيانات حقيقية مباشرة • آخر تحديث "+new Date().toLocaleTimeString("en-GB");
  }catch(e){
    $("status").textContent="الأسعار المباشرة ما تشتغل داخل صفحات Claude (الاتصال الخارجي محظور). ارفع الملف على GitHub Pages عشان تشتغل الأسعار الحقيقية.";
  }
}

["sym","tf"].forEach(id=>$(id).addEventListener("change",()=>{offset=0;load()}));
["len","tol","onlyEq"].forEach(id=>$(id).addEventListener("change",()=>{analyze();render()}));
window.addEventListener("resize",draw);

// سحب أفقي للتنقل + قرص للتكبير
let tx=null,pd=null;
cv.addEventListener("touchstart",e=>{
  if(e.touches.length===1)tx=e.touches[0].clientX;
  if(e.touches.length===2)pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
cv.addEventListener("touchmove",e=>{
  if(e.touches.length===1&&tx!==null){
    const dx=e.touches[0].clientX-tx,step=cv.clientWidth/viewN;
    if(Math.abs(dx)>step){offset=Math.max(0,Math.min(candles.length-viewN,offset+Math.round(dx/step)));tx=e.touches[0].clientX;draw();}
  }else if(e.touches.length===2&&pd){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    viewN=Math.max(30,Math.min(400,Math.round(viewN*pd/d)));pd=d;draw();
  }
},{passive:true});
cv.addEventListener("touchend",()=>{tx=null;pd=null});

load();
setInterval(load,5000);
</script>
</body>
</html>
