<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAU/USD — شارت ذهب</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Tajawal:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0c0f; color: #e0e0e0; font-family: 'Tajawal', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0d1117; border-bottom: 1px solid #1e2530; }
  .pair { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: #f0c040; letter-spacing: 1px; }
  .price-display { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #00e676; }
  .price-change { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #00e676; }
  .signal-badge { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; font-weight: 700; font-size: 15px; letter-spacing: 1px; transition: all 0.3s; }
  .signal-badge.buy  { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid #00e676; }
  .signal-badge.sell { background: rgba(255,82,82,0.15);  color: #ff5252; border: 1px solid #ff5252; }
  .signal-badge.wait { background: rgba(255,193,7,0.12);  color: #ffc107; border: 1px solid #ffc107; }
  .tf-bar { display: flex; gap: 4px; padding: 8px 16px; background: #0d1117; border-bottom: 1px solid #1e2530; align-items: center; }
  .tf-btn { padding: 4px 12px; border-radius: 4px; border: 1px solid #1e2530; background: transparent; color: #888; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .tf-btn.active, .tf-btn:hover { background: #f0c040; color: #0a0c0f; border-color: #f0c040; font-weight: 600; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #00e676; margin-right: auto; animation: blink 1.2s infinite; }
  .live-label { font-size: 11px; color: #00e676; font-family: 'IBM Plex Mono', monospace; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .chart-wrapper { flex: 1; position: relative; padding: 8px 16px 0; }
  canvas { display: block; width: 100%; border-radius: 8px; }
  .legend { display: flex; gap: 16px; padding: 10px 16px; flex-wrap: wrap; background: #0d1117; border-top: 1px solid #1e2530; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; }
  .stats-row { display: flex; gap: 0; border-top: 1px solid #1e2530; }
  .stat-box { flex: 1; padding: 10px; text-align: center; border-right: 1px solid #1e2530; }
  .stat-box:last-child { border-right: none; }
  .stat-label { font-size: 10px; color: #666; margin-bottom: 2px; }
  .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; }
  .green { color: #00e676; } .red { color: #ff5252; } .gold { color: #f0c040; }
  #apiStatus { font-size: 10px; color: #555; font-family: 'IBM Plex Mono', monospace; padding: 0 16px 4px; text-align: center; }
</style>
</head>
<body>

<header>
  <div>
    <div class="pair">XAU / USD</div>
    <div class="price-change" id="priceChange">جاري التحميل...</div>
  </div>
  <div class="price-display" id="livePrice">——</div>
  <div class="signal-badge wait" id="mainSignal">◆ انتظار</div>
</header>

<div class="tf-bar">
  <button class="tf-btn" onclick="setTF(1,this)">M1</button>
  <button class="tf-btn" onclick="setTF(5,this)">M5</button>
  <button class="tf-btn active" onclick="setTF(15,this)">M15</button>
  <button class="tf-btn" onclick="setTF(60,this)">H1</button>
  <button class="tf-btn" onclick="setTF(240,this)">H4</button>
  <span class="live-dot" style="margin-right:auto;margin-left:8px"></span>
  <span class="live-label">LIVE</span>
</div>

<div id="apiStatus">⏳ جاري جلب السعر الحقيقي...</div>

<div class="chart-wrapper">
  <canvas id="chartCanvas"></canvas>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#00e676"></div> شمعة صاعدة</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff5252"></div> شمعة هابطة</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0c040;border-radius:50%"></div> قمة</div>
  <div class="legend-item"><div class="legend-dot" style="background:#29b6f6;border-radius:50%"></div> قاع</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00e676;border-radius:50%"></div> BUY ↑</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff5252;border-radius:50%"></div> SELL ↓</div>
</div>

<div class="stats-row">
  <div class="stat-box"><div class="stat-label">أعلى سعر</div><div class="stat-val gold" id="statHigh">——</div></div>
  <div class="stat-box"><div class="stat-label">أدنى سعر</div><div class="stat-val gold" id="statLow">——</div></div>
  <div class="stat-box"><div class="stat-label">BUY إشارات</div><div class="stat-val green" id="statBuy">0</div></div>
  <div class="stat-box"><div class="stat-label">SELL إشارات</div><div class="stat-val red" id="statSell">0</div></div>
  <div class="stat-box"><div class="stat-label">قمم/قيعان</div><div class="stat-val gold" id="statSR">0</div></div>
</div>

<script>
const GOLD_API_KEY = 'goldapi-d69a0ef36a51169f92de3b71e7249575-io';
let currentTF = 15;
let candles = [];
let signals = [];
let swings  = [];
let realPrice = null;
let prevRealPrice = null;
let basePrice = 3300; // fallback

// ── FETCH REAL PRICE FROM GOLDAPI ──
async function fetchRealPrice() {
  try {
    const res = await fetch('https://www.goldapi.io/api/XAU/USD', {
      headers: { 'x-access-token': GOLD_API_KEY, 'Content-Type': 'application/json' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    prevRealPrice = realPrice;
    realPrice = data.price;
    basePrice  = realPrice;

    // Update header price
    const priceEl  = document.getElementById('livePrice');
    const changeEl = document.getElementById('priceChange');
    priceEl.textContent = realPrice.toFixed(2);

    if (prevRealPrice !== null) {
      const diff = realPrice - prevRealPrice;
      const pct  = (diff / prevRealPrice * 100).toFixed(2);
      changeEl.textContent = `${diff >= 0 ? '+' : ''}${diff.toFixed(2)} (${diff >= 0 ? '+' : ''}${pct}%)`;
      changeEl.style.color = diff >= 0 ? '#00e676' : '#ff5252';
      priceEl.style.color  = diff >= 0 ? '#00e676' : '#ff5252';
    } else {
      const ch = data.ch || 0;
      const cp = data.chp || 0;
      changeEl.textContent = `${ch >= 0 ? '+' : ''}${ch.toFixed(2)} (${cp >= 0 ? '+' : ''}${cp.toFixed(2)}%)`;
      changeEl.style.color = ch >= 0 ? '#00e676' : '#ff5252';
      priceEl.style.color  = ch >= 0 ? '#00e676' : '#ff5252';
    }

    document.getElementById('apiStatus').textContent =
      `✅ سعر حقيقي · آخر تحديث: ${new Date().toLocaleTimeString('ar-SA')}`;

    // Update last candle's close to match real price
    if (candles.length > 0) {
      const last = candles[candles.length - 1];
      last.close   = realPrice;
      last.high    = Math.max(last.high, realPrice);
      last.low     = Math.min(last.low,  realPrice);
      last.bullish = realPrice >= last.open;
      draw();
    }

    return realPrice;
  } catch (err) {
    document.getElementById('apiStatus').textContent = '⚠️ خطأ في الاتصال — ' + err.message;
    return null;
  }
}

// ── CANDLE GENERATOR (anchored to real price) ──
function generateCandles(tf, count = 60) {
  const arr = [];
  const volatility = tf === 1 ? 1.5 : tf === 5 ? 3 : tf === 15 ? 6 : tf === 60 ? 14 : 28;
  const now = Date.now();
  const interval = tf * 60 * 1000;

  // Work backwards from real price
  let price = basePrice;
  const raw = [];
  for (let i = 0; i <= count; i++) {
    const open   = price;
    const change = (Math.random() - 0.48) * volatility;
    const close  = open + change;
    const wickUp   = Math.random() * volatility * 0.6;
    const wickDown = Math.random() * volatility * 0.6;
    raw.push({ open, close,
      high: Math.max(open, close) + wickUp,
      low:  Math.min(open, close) + wickDown,
      time: new Date(now - (count - i) * interval),
      bullish: close >= open
    });
    price = close;
  }

  // Anchor last candle close to real price
  if (realPrice && raw.length > 0) {
    const diff = realPrice - raw[raw.length - 1].close;
    raw.forEach(c => {
      c.open  += diff; c.close += diff;
      c.high  += diff; c.low   += diff;
    });
    raw[raw.length - 1].close = realPrice;
    raw[raw.length - 1].high  = Math.max(raw[raw.length - 1].high, realPrice);
    raw[raw.length - 1].bullish = realPrice >= raw[raw.length - 1].open;
  }
  return raw;
}

// ── SWING DETECTION ──
function detectSwings(candles) {
  const result = [];
  for (let i = 2; i < candles.length - 2; i++) {
    const isHigh = candles[i].high > candles[i-1].high && candles[i].high > candles[i-2].high &&
                   candles[i].high > candles[i+1].high && candles[i].high > candles[i+2].high;
    const isLow  = candles[i].low < candles[i-1].low  && candles[i].low < candles[i-2].low &&
                   candles[i].low < candles[i+1].low  && candles[i].low < candles[i+2].low;
    if (isHigh) result.push({ idx: i, type: 'high', price: candles[i].high });
    if (isLow)  result.push({ idx: i, type: 'low',  price: candles[i].low  });
  }
  return result;
}

// ── SIGNAL DETECTION ──
function detectSignals(candles, swings) {
  const result = [];
  for (let s = 1; s < swings.length; s++) {
    const prev = swings[s-1], curr = swings[s];
    if (curr.type === 'low'  && prev.type === 'low'  && curr.price > prev.price && candles[curr.idx+1])
      result.push({ idx: curr.idx + 1, type: 'buy',  price: candles[curr.idx+1].low });
    if (curr.type === 'high' && prev.type === 'high' && curr.price < prev.price && candles[curr.idx+1])
      result.push({ idx: curr.idx + 1, type: 'sell', price: candles[curr.idx+1].high });
  }
  return result;
}

// ── CANVAS DRAW ──
const canvas = document.getElementById('chartCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const wrapper = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = wrapper.clientWidth;
  const h = Math.min(window.innerHeight * 0.52, 380);
  canvas.width  = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);
  draw();
}

function draw() {
  if (candles.length === 0) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  const PAD_L = 8, PAD_R = 62, PAD_T = 20, PAD_B = 28;
  const chartW = W - PAD_L - PAD_R, chartH = H - PAD_T - PAD_B;

  const prices = candles.flatMap(c => [c.high, c.low]);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const range = maxP - minP || 1;

  const toY = p => PAD_T + chartH - ((p - minP) / range) * chartH;
  const totalCandles = candles.length;
  const candleW = Math.max(3, Math.floor(chartW / totalCandles) - 1);
  const toX = i => PAD_L + i * (chartW / totalCandles) + candleW / 2;

  // Grid
  ctx.setLineDash([3,5]); ctx.strokeStyle = '#1e2530'; ctx.lineWidth = 1;
  for (let g = 0; g <= 5; g++) {
    const y = PAD_T + (g / 5) * chartH;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    const price = maxP - (g / 5) * range;
    ctx.fillStyle = '#555'; ctx.font = '10px IBM Plex Mono,monospace'; ctx.textAlign = 'left';
    ctx.fillText(price.toFixed(2), W - PAD_R + 4, y + 4);
  }
  ctx.setLineDash([]);

  // Time labels
  ctx.fillStyle = '#444'; ctx.font = '9px IBM Plex Mono,monospace'; ctx.textAlign = 'center';
  const labelStep = Math.ceil(totalCandles / 6);
  for (let i = 0; i < totalCandles; i += labelStep) {
    const t = candles[i].time;
    ctx.fillText(`${t.getHours().toString().padStart(2,'0')}:${t.getMinutes().toString().padStart(2,'0')}`, toX(i), H - 6);
  }

  // Swing lines
  swings.forEach(sw => {
    const y = toY(sw.price);
    ctx.setLineDash([4,6]);
    ctx.strokeStyle = sw.type === 'high' ? 'rgba(240,192,64,0.25)' : 'rgba(41,182,246,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    ctx.setLineDash([]);
  });

  // Candles
  candles.forEach((c, i) => {
    const x = toX(i), openY = toY(c.open), closeY = toY(c.close);
    const highY = toY(c.high), lowY = toY(c.low);
    const color = c.bullish ? '#00e676' : '#ff5252';
    const halfW = Math.max(2, candleW / 2 - 0.5);
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, highY); ctx.lineTo(x, lowY); ctx.stroke();
    const bodyTop = Math.min(openY, closeY), bodyH = Math.max(1, Math.abs(openY - closeY));
    ctx.fillStyle = c.bullish ? 'rgba(0,230,118,0.85)' : 'rgba(255,82,82,0.85)';
    ctx.fillRect(x - halfW, bodyTop, halfW * 2, bodyH);
    ctx.strokeStyle = color; ctx.lineWidth = 0.5;
    ctx.strokeRect(x - halfW, bodyTop, halfW * 2, bodyH);
  });

  // Swing markers
  swings.forEach(sw => {
    const x = toX(sw.idx), y = toY(sw.price), isHigh = sw.type === 'high';
    ctx.beginPath();
    ctx.arc(x, y + (isHigh ? -10 : 10), 5, 0, Math.PI * 2);
    ctx.fillStyle = isHigh ? '#f0c040' : '#29b6f6';
    ctx.fill();
    ctx.font = 'bold 9px Tajawal,sans-serif';
    ctx.fillStyle = isHigh ? '#f0c040' : '#29b6f6';
    ctx.textAlign = 'center';
    ctx.fillText(isHigh ? 'قمة' : 'قاع', x, y + (isHigh ? -18 : 22));
  });

  // BUY/SELL signals
  signals.forEach(sig => {
    if (!candles[sig.idx]) return;
    const x = toX(sig.idx), isBuy = sig.type === 'buy', c = candles[sig.idx];
    const y = isBuy ? toY(c.low) + 18 : toY(c.high) - 18;
    const arrowSize = 10;
    ctx.beginPath();
    if (isBuy) {
      ctx.moveTo(x, y - arrowSize); ctx.lineTo(x + arrowSize*0.6, y); ctx.lineTo(x - arrowSize*0.6, y);
      ctx.fillStyle = '#00e676';
    } else {
      ctx.moveTo(x, y + arrowSize); ctx.lineTo(x + arrowSize*0.6, y); ctx.lineTo(x - arrowSize*0.6, y);
      ctx.fillStyle = '#ff5252';
    }
    ctx.closePath(); ctx.fill();
    ctx.font = 'bold 10px IBM Plex Mono,monospace';
    ctx.fillStyle = isBuy ? '#00e676' : '#ff5252';
    ctx.textAlign = 'center';
    ctx.fillText(isBuy ? 'BUY' : 'SELL', x, isBuy ? y + 20 : y - 14);
  });

  // Last price line
  const lastPrice = candles[candles.length - 1].close;
  const ly = toY(lastPrice);
  ctx.setLineDash([5,5]); ctx.strokeStyle = 'rgba(240,192,64,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD_L, ly); ctx.lineTo(W - PAD_R, ly); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#f0c040';
  ctx.fillRect(W - PAD_R + 1, ly - 9, PAD_R - 2, 18);
  ctx.fillStyle = '#0a0c0f'; ctx.font = 'bold 9px IBM Plex Mono,monospace'; ctx.textAlign = 'center';
  ctx.fillText(lastPrice.toFixed(2), W - PAD_R + (PAD_R / 2), ly + 4);
}

// ── LOAD CHART ──
function loadChart(tf) {
  candles = generateCandles(tf, 60);
  swings  = detectSwings(candles);
  signals = detectSignals(candles, swings);

  const last  = candles[candles.length - 1].close;
  const first = candles[0].open;
  const diff  = last - first;
  const pct   = (diff / first * 100).toFixed(2);

  if (realPrice === null) {
    document.getElementById('livePrice').textContent = last.toFixed(2);
    document.getElementById('priceChange').textContent = `${diff >= 0?'+':''}${diff.toFixed(2)} (${diff>=0?'+':''}${pct}%)`;
  }

  const highs = candles.map(c => c.high), lows = candles.map(c => c.low);
  document.getElementById('statHigh').textContent = Math.max(...highs).toFixed(2);
  document.getElementById('statLow').textContent  = Math.min(...lows).toFixed(2);

  const buyCount  = signals.filter(s => s.type === 'buy').length;
  const sellCount = signals.filter(s => s.type === 'sell').length;
  document.getElementById('statBuy').textContent  = buyCount;
  document.getElementById('statSell').textContent = sellCount;
  document.getElementById('statSR').textContent   = swings.length;

  const badge = document.getElementById('mainSignal');
  if (buyCount > sellCount) { badge.textContent='▲ شراء'; badge.className='signal-badge buy'; }
  else if (sellCount > buyCount) { badge.textContent='▼ بيع'; badge.className='signal-badge sell'; }
  else { badge.textContent='◆ انتظار'; badge.className='signal-badge wait'; }

  draw();
}

function setTF(tf, btn) {
  currentTF = tf;
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadChart(tf);
}

// ── STARTUP ──
window.addEventListener('resize', resize);
resize();
loadChart(currentTF);

// Fetch real price immediately then every 30s
fetchRealPrice().then(() => loadChart(currentTF));
setInterval(() => fetchRealPrice(), 30000);
</script>
</body>
</html>
