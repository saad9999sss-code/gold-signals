<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سهم قبل الافتتاح</title>
<style>
:root{--bg:#14120e;--card:#1e1b15;--line:#3a3426;--tx:#f1ead8;--mu:#a39a83;--gold:#d9a93a;--up:#4ec28a;--dn:#e5624f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:22px 0 4px;color:var(--gold)}
p.sub{margin:0 0 16px;color:var(--mu);font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:10px;font-size:15px;font-family:inherit}
input{direction:ltr;text-align:left}
textarea{direction:ltr;text-align:left;min-height:70px}
button{margin-top:14px;width:100%;background:var(--gold);color:#14120e;border:0;border-radius:8px;padding:13px;font-size:17px;font-weight:700;font-family:inherit}
button:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#st{margin:14px 0;color:var(--mu);font-size:14px;min-height:20px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-size:24px;font-weight:700;direction:ltr}
.gap{font-size:22px;font-weight:700;direction:ltr}
.up{color:var(--up)}.dn{color:var(--dn)}
.meta{color:var(--mu);font-size:13px;direction:ltr;text-align:right}
.sc{display:inline-block;margin:8px 0;padding:2px 10px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:13px}
.n{display:block;color:var(--tx);text-decoration:none;font-size:14px;padding:7px 0;border-top:1px solid var(--line);direction:ltr;text-align:left}
.n.good{color:var(--up)}.n.bad{color:var(--dn)}
.w{color:var(--mu);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>سهم قبل الافتتاح</h1>
<p class="sub">أسهم أمريكية ارتفعت عن إغلاق أمس ومعها أخبار إيجابية، مرتبة من الأقوى.</p>

<label for="k">مفتاح Finnhub المجاني</label>
<input id="k" type="password" autocomplete="off" placeholder="الصق المفتاح هنا">

<label for="u">الأسهم المراقبة (افصل بينها بفاصلة)</label>
<textarea id="u"></textarea>

<button id="go">ابحث الآن</button>
<div id="st"></div>
<div id="out"></div>
<p class="w">للمراقبة فقط وليست توصية. السيولة قبل الافتتاح قليلة والسبريد واسع، والخبر قد يكون منعكساً في السعر. المفتاح يُحفظ في جوالك فقط.</p>
</main>
<script>
const DEF="NVDA,TSLA,AAPL,AMD,META,AMZN,MSFT,GOOGL,NFLX,PLTR,SMCI,COIN,MSTR,HOOD,SOFI,RIVN,NIO,MARA,RIOT,AFRM,UPST,SNOW,CRWD,SHOP,UBER,ABNB,DKNG,RBLX,ROKU,PYPL,INTC,MU,AVGO,ARM,SOUN,IONQ,RKLB,ASTS,LCID,F";
const POS=["beats","beat","tops","surge","soar","jumps","record","upgrade","raises","raised guidance","raises guidance","fda approval","approval","approved","approves","acquire","acquisition","buyout","partnership","contract","wins","breakthrough","strong demand","outperform","price target","buyback","profit","exceeds","above expectations","launch"];
const NEG=["miss","misses","falls","plunge","downgrade","cuts","lawsuit","probe","investigation","recall","bankruptcy","offering","dilution","layoff","warning","delay","rejects","fraud"];
const $=id=>document.getElementById(id);
const K="pm_key",U="pm_list";
try{$("k").value=localStorage.getItem(K)||"";}catch(e){}
try{$("u").value=localStorage.getItem(U)||DEF;}catch(e){$("u").value=DEF;}
const B="https://finnhub.io/api/v1";
const day=d=>d.toISOString().slice(0,10);
async function api(p,key){
  const r=await fetch(B+p+(p.includes("?")?"&":"?")+"token="+encodeURIComponent(key));
  if(r.status===401||r.status===403)throw new Error("المفتاح غير صحيح");
  if(r.status===429)throw new Error("تجاوزت حد الطلبات، انتظر دقيقة وحاول");
  if(!r.ok)throw new Error("تعذر جلب البيانات");
  return r.json();
}
function rate(h){
  const t=h.toLowerCase();let s=0;
  POS.forEach(w=>{if(t.includes(w))s++});
  NEG.forEach(w=>{if(t.includes(w))s--});
  return s;
}
$("go").onclick=async()=>{
  const key=$("k").value.trim();
  const list=[...new Set($("u").value.toUpperCase().split(/[\s,،]+/).filter(Boolean))].slice(0,45);
  if(!key){$("st").textContent="الصق مفتاح Finnhub أولاً (finnhub.io ثم Register).";return;}
  try{localStorage.setItem(K,key);localStorage.setItem(U,$("u").value);}catch(e){}
  const btn=$("go");btn.disabled=true;$("out").innerHTML="";
  try{
    $("st").textContent="جلب الأسعار...";
    const q=[];
    for(const s of list){
      try{const d=await api("/quote?symbol="+s,key);
        if(d&&d.pc>0&&d.c>0)q.push({s,c:d.c,pc:d.pc,g:(d.c-d.pc)/d.pc*100});
      }catch(e){if(/المفتاح|حد/.test(e.message))throw e;}
    }
    const cand=q.filter(x=>x.g>0.5).sort((a,b)=>b.g-a.g).slice(0,12);
    if(!cand.length){$("st").textContent="ما فيه أسهم مرتفعة في القائمة الحين. جرّب قبل الافتتاح أو وسّع القائمة.";return;}
    $("st").textContent="جلب الأخبار...";
    const to=new Date(),from=new Date(Date.now()-864e5);
    for(const x of cand){
      let n=[];
      try{n=await api("/company-news?symbol="+x.s+"&from="+day(from)+"&to="+day(to),key);}catch(e){if(/المفتاح|حد/.test(e.message))throw e;}
      const recent=n.filter(i=>i.datetime*1000>Date.now()-864e5).slice(0,12);
      x.news=recent.map(i=>({h:i.headline,u:i.url,r:rate(i.headline)}));
      const kw=x.news.reduce((a,i)=>a+Math.max(i.r,-2),0);
      x.score=Math.max(0,Math.min(100,Math.round(kw*14+Math.min(x.g,10)*4)));
    }
    const res=cand.filter(x=>x.news.some(i=>i.r>0)).sort((a,b)=>b.score-a.score).slice(0,5);
    if(!res.length){$("st").textContent="فيه أسهم مرتفعة لكن بدون أخبار إيجابية واضحة الحين.";return;}
    $("st").textContent="أقوى "+res.length+" من "+q.length+" سهم تم فحصه";
    $("out").innerHTML=res.map(x=>{
      const items=x.news.filter(i=>i.r!==0).concat(x.news.filter(i=>i.r===0)).slice(0,3);
      return '<div class="c"><div class="top"><span class="sym">'+x.s+'</span><span class="gap up">+'+x.g.toFixed(2)+'%</span></div>'+
      '<div class="meta">$'+x.c.toFixed(2)+' / '+x.pc.toFixed(2)+'</div>'+
      '<span class="sc">قوة الخبر '+x.score+'/100</span>'+
      items.map(i=>'<a class="n '+(i.r>0?'good':i.r<0?'bad':'')+'" href="'+encodeURI(i.u)+'" target="_blank" rel="noopener">'+i.h.replace(/</g,"&lt;")+'</a>').join("")+'</div>';
    }).join("");
  }catch(e){$("st").textContent=e.message;}
  finally{btn.disabled=false;}
};
</script>
</body>
</html>
